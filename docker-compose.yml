version: "3.9"

services:
  healthcare:
    build:
      context: https://github.com/itsPremkumar/aetheria-healthcare.git#main
      dockerfile: Dockerfile
    container_name: aetheria-healthcare
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  education:
